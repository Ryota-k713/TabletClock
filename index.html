<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NieR Tactical Flip Clock</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            /* NieR Automata Color Scheme */
            --bg-color: #E5DFC9;
            --grid-line: rgba(74, 69, 61, 0.08);
            --card-bg: #2B2825;
            --card-text: #E5DFC9;
            --panel-bg: rgba(229, 223, 201, 0.85);
            --accent-pink: #B35478;
            --accent-teal: #008D9B;
            --text-main: #3A352F;
            --text-sub: #7A7468;
            --border-color: #A39D8D;
            --shadow-color: rgba(43, 40, 37, 0.25);
        }

        /* Dark Mode Theme */
        body.dark-mode {
            --bg-color: #1A1918;
            --grid-line: rgba(229, 223, 201, 0.05);
            --card-bg: #2B2825;
            --card-text: #E5DFC9;
            --panel-bg: rgba(26, 25, 24, 0.85);
            --accent-pink: #D86B93;
            --accent-teal: #00B4C5;
            --text-main: #D8D2C2;
            --text-sub: #8C867A;
            --border-color: #4A453D;
            --shadow-color: rgba(0, 0, 0, 0.5);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Share Tech Mono', 'Zen Kaku Gothic New', monospace;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            background-image: 
                linear-gradient(var(--grid-line) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
            background-size: 20px 20px;
            transition: background-color 0.4s ease, color 0.4s ease;
        }

        /* Scanline Overlay */
        body::after {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.03) 50%);
            background-size: 100% 4px;
            z-index: 100;
            pointer-events: none;
        }

        /* Header UI */
        header {
            width: 100%;
            padding: 15px 40px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            z-index: 10;
            transition: opacity 0.4s ease;
        }

        .system-title-box {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .system-title {
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: 2px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .system-title::before {
            content: "";
            display: inline-block;
            width: 12px;
            height: 12px;
            background-color: var(--accent-pink);
        }

        .date-display {
            font-size: 1rem;
            color: var(--text-sub);
            letter-spacing: 1px;
            margin-left: 20px;
        }

        /* Main Clock Section */
        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            z-index: 10;
        }

        .clock-container {
            display: flex;
            align-items: center;
            gap: 1.5vw;
        }

        .group-container {
            display: flex;
            gap: 0.6vw;
        }

        /* Flip Unit Styles */
        .flip-unit {
            position: relative;
            width: 13vw;
            height: 18vw;
            max-width: 180px;
            max-height: 250px;
            font-size: 13vw;
            font-weight: bold;
            perspective: 1000px;
            box-shadow: 0 10px 25px var(--shadow-color);
            border-radius: 6px;
        }

        @media (min-width: 1200px) {
            .flip-unit {
                font-size: 160px;
            }
        }

        /* Top & Bottom Cards */
        .card-top, .card-bottom, .card-top-flip, .card-bottom-flip {
            position: absolute;
            left: 0;
            width: 100%;
            height: 50%;
            overflow: hidden;
            background-color: var(--card-bg);
            color: var(--card-text);
            text-align: center;
        }

        .card-top, .card-top-flip {
            top: 0;
            border-top-left-radius: 6px;
            border-top-right-radius: 6px;
            border-bottom: 1px solid rgba(0, 0, 0, 0.4);
        }

        .card-bottom, .card-bottom-flip {
            bottom: 0;
            border-bottom-left-radius: 6px;
            border-bottom-right-radius: 6px;
        }

        /* Digit Alignment (厳密なフォント中央配置) */
        .digit {
            position: absolute;
            left: 0;
            width: 100%;
            height: 200%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Share Tech Mono', monospace;
            line-height: 1;
        }

        .card-top .digit, .card-top-flip .digit {
            top: 0;
        }

        .card-bottom .digit, .card-bottom-flip .digit {
            bottom: 0;
        }
