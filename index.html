<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NieR Tactical Flip Clock & Pomodoro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #E5DFC9;
            --grid-line: rgba(74, 69, 61, 0.08);
            --card-bg: #2B2825;
            --card-text: #E5DFC9;
            --panel-bg: rgba(229, 223, 201, 0.9);
            --accent-pink: #B35478;
            --accent-teal: #008D9B;
            --text-main: #3A352F;
            --text-sub: #7A7468;
            --border-color: #A39D8D;
            --shadow-color: rgba(43, 40, 37, 0.25);
        }

        body.dark-mode {
            --bg-color: #1A1918;
            --grid-line: rgba(229, 223, 201, 0.05);
            --card-bg: #2B2825;
            --card-text: #E5DFC9;
            --panel-bg: rgba(26, 25, 24, 0.9);
            --accent-pink: #D86B93;
            --accent-teal: #00B4C5;
            --text-main: #D8D2C2;
            --text-sub: #8C867A;
            --border-color: #4A453D;
            --shadow-color: rgba(0, 0, 0, 0.5);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Share Tech Mono', 'Zen Kaku Gothic New', monospace;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            background-image: 
                linear-gradient(var(--grid-line) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
            background-size: 24px 24px;
            transition: background-color 0.4s ease, color 0.4s ease;
        }

        /* ヘッダー */
        header {
            width: 100%;
            padding: 16px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        .system-title-box {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .system-title {
            font-size: 0.95rem;
            font-weight: 700;
            letter-spacing: 2px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-sub);
        }

        .system-title::before {
            content: "";
            display: inline-block;
            width: 8px;
            height: 8px;
            background-color: var(--accent-pink);
        }

        .date-display {
            font-size: 2.1rem;
            font-weight: 700;
            color: var(--text-main);
            letter-spacing: 2px;
            margin-left: 16px;
            font-family: 'Share Tech Mono', monospace;
        }

        /* メインエリア（時間とポモドーロの間隔を広く設定） */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 100%;
            padding: 0 16px;
            gap: 45px; /* 時間とポモドーロの間隔を広げました */
            z-index: 10;
        }

        /* 左右限界まで幅を広げた時計コンテナ */
        .clock-container {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-width: 1100px; /* 10インチ左右いっぱいに設定 */
            gap: 20px;
        }

        .group-container {
            display: flex;
            gap: 12px;
        }

        /* 時計カードの極限拡大 */
        .flip-unit {
            position: relative;
            width: 175px;
            height: 245px;
            perspective: 500px;
            box-shadow: 0 14px 35px var(--shadow-color);
            border-radius: 8px;
            background-color: var(--card-bg);
        }

        .seconds-group .flip-unit {
            width: 115px;
            height: 165px;
        }

        /* 数字フォントの超大型化 */
        .card-half {
            position: absolute;
            left: 0;
            width: 100%;
            height: 50%;
            overflow: hidden;
            color: var(--card-text);
            background-color: var(--card-bg);
            font-family: 'Share Tech Mono', monospace;
            font-size: 200px;
            font-weight: bold;
            display: flex;
            justify-content: center;
        }

        .seconds-group .card-half {
            font-size: 130px;
        }

        .card-top {
            top: 0;
            border-top-left-radius: 8px;
            border-top-right-radius: 8px;
            align-items: flex-end;
            border-bottom: 1px solid rgba(0, 0, 0, 0.4);
        }
        .card-top span { transform: translateY(50%); }

        .card-bottom {
            bottom: 0;
            border-bottom-left-radius: 8px;
            border-bottom-right-radius: 8px;
            align-items: flex-start;
        }
        .card-bottom span { transform: translateY(-50%); }

        .card-flipping {
            top: 0;
            border-top-left-radius: 8px;
            border-top-right-radius: 8px;
            align-items: flex-end;
            transform-origin: bottom;
            transform-style: preserve-3d;
            z-index: 20;
            backface-visibility: hidden;
        }
        .card-flipping span { transform: translateY(50%); }

        .fold-animation {
            animation: flipFold 0.35s ease-in forwards;
        }

        @keyframes flipFold {
            0% { transform: rotateX(0deg); background-color: var(--card-bg); }
            100% { transform: rotateX(-180deg); background-color: #1a1816; }
        }

        .flip-unit::before {
            content: "";
            position: absolute;
            top: 50%;
            left: 0;
            width: 100%;
            height: 2px;
            background-color: rgba(0, 0, 0, 0.75);
            z-index: 30;
            margin-top: -1px;
            pointer-events: none;
        }

        .flip-unit::after {
            content: "";
            position: absolute;
            top: 50%;
            left: -4px;
            right: -4px;
            height: 12px;
            border-left: 7px solid var(--border-color);
            border-right: 7px solid var(--border-color);
            margin-top: -6px;
            z-index: 31;
            pointer-events: none;
        }

        /* コロン */
        .colon-container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 24px;
        }

        .colon-dot {
            width: 16px;
            height: 16px;
            background-color: var(--text-main);
            opacity: 0.8;
        }

        /* ポモドーロタイマーパネル（左右いっぱいに拡大） */
        .pomodoro-panel {
            width: 100%;
            max-width: 1080px; /* 時計の幅に合わせて左右余白を最小化 */
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            padding: 20px 36px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            box-shadow: 0 6px 20px var(--shadow-color);
            backdrop-filter: blur(4px);
        }

        .pomodoro-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 1.1rem;
            letter-spacing: 1.5px;
        }

        .pomodoro-time {
            font-family: 'Share Tech Mono', monospace;
            font-size: 1.8rem;
            font-weight: bold;
            color: var(--accent-pink);
        }

        .pomo-meter-track {
            width: 100%;
            height: 18px;
            background-color: rgba(0, 0, 0, 0.15);
            border: 1px solid var(--border-color);
            position: relative;
            overflow: hidden;
        }

        .pomo-meter-fill {
            position: absolute;
            top: 0;
            right: 0;
            width: 100%;
            height: 100%;
            background-color: var(--accent-pink);
            transition: width 0.3s linear;
        }

        .pomodoro-controls {
            display: flex;
            justify-content: flex-end;
            gap: 18px;
        }

        /* フッター */
        footer {
            width: 100%;
            padding: 0 32px 18px 32px;
            z-index: 10;
        }

        .nier-footer-box {
            position: relative;
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            padding: 12px 28px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nier-footer-box::before {
            content: "";
            position: absolute;
            left: 5px;
            top: 5px;
            bottom: 5px;
            width: 6px;
            border-left: 2px solid var(--text-main);
            border-right: 1px solid var(--text-main);
        }

        .nier-footer-box::after {
            content: "";
            position: absolute;
            right: 8px;
            bottom: 8px;
            width: 7px;
            height: 7px;
            background-color: var(--text-main);
        }

        .footer-message {
            font-size: 0.95rem;
            letter-spacing: 1px;
            padding-left: 12px;
        }

        .footer-controls {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .nier-btn {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 8px 20px;
            font-family: inherit;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .nier-btn:hover, .nier-btn:active {
            background-color: var(--text-main);
            color: var(--bg-color);
        }

        .dots-pattern-line {
            width: 100%;
            height: 6px;
            margin-top: 8px;
            background-image: radial-gradient(var(--text-main) 1.5px, transparent 1.5px);
            background-size: 10px 8px;
            opacity: 0.6;
        }
    </style>
</head>
<body>

    <header id="header-ui">
        <div class="system-title-box">
            <div class="system-title">// SYSTEM : KAKEIBO_CLOCK [v4.1]</div>
            <div class="date-display" id="date-text">----/--/-- (---)</div>
        </div>
        <div id="battery-box" style="font-size: 1.1rem; color: var(--text-sub); font-family: 'Share Tech Mono', monospace;">
            BATTERY: <span id="battery-text">--%</span>
        </div>
    </header>

    <main>
        <!-- パタパタ時計（左右拡大） -->
        <div class="clock-container">
            <div class="group-container">
                <div class="flip-unit" id="h1"><div class="card-half card-top"><span>0</span></div><div class="card-half card-bottom"><span>0</span></div></div>
                <div class="flip-unit" id="h2"><div class="card-half card-top"><span>0</span></div><div class="card-half card-bottom"><span>0</span></div></div>
            </div>

            <div class="colon-container">
                <div class="colon-dot"></div>
                <div class="colon-dot"></div>
            </div>

            <div class="group-container">
                <div class="flip-unit" id="m1"><div class="card-half card-top"><span>0</span></div><div class="card-half card-bottom"><span>0</span></div></div>
                <div class="flip-unit" id="m2"><div class="card-half card-top"><span>0</span></div><div class="card-half card-bottom"><span>0</span></div></div>
            </div>

            <div class="colon-container sec-colon" id="sec-colon">
                <div class="colon-dot"></div>
                <div class="colon-dot"></div>
            </div>

            <div class="group-container seconds-group" id="sec-group">
                <div class="flip-unit" id="s1"><div class="card-half card-top"><span>0</span></div><div class="card-half card-bottom"><span>0</span></div></div>
                <div class="flip-unit" id="s2"><div class="card-half card-top"><span>0</span></div><div class="card-half card-bottom"><span>0</span></div></div>
            </div>
        </div>

        <!-- ポモドーロタイマーパネル（左右拡大 ＆ 間隔広め） -->
        <div class="pomodoro-panel">
            <div class="pomodoro-header">
                <span>// POMODORO TIMER (30 MIN)</span>
                <span class="pomodoro-time" id="pomo-display">30:00</span>
            </div>
            <div class="pomo-meter-track">
                <div class="pomo-meter-fill" id="pomo-fill" style="width: 100%;"></div>
            </div>
            <div class="pomodoro-controls">
                <button class="nier-btn" id="pomo-start-btn">▶ START</button>
                <button class="nier-btn" id="pomo-stop-btn">■ STOP</button>
                <button class="nier-btn" id="pomo-reset-btn">↺ RESET</button>
            </div>
        </div>
    </main>

    <footer id="footer-ui">
        <div class="nier-footer-box">
            <div class="footer-message" id="pomo-status-msg">
