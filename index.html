<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NieR Tactical Flip Clock & Pomodoro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #E5DFC9;
            --grid-line: rgba(74, 69, 61, 0.08);
            --card-bg: #2B2825;
            --card-text: #E5DFC9;
            --panel-bg: rgba(229, 223, 201, 0.9);
            --accent-pink: #B35478;
            --accent-teal: #008D9B;
            --text-main: #3A352F;
            --text-sub: #7A7468;
            --border-color: #A39D8D;
            --shadow-color: rgba(43, 40, 37, 0.25);
        }

        body.dark-mode {
            --bg-color: #1A1918;
            --grid-line: rgba(229, 223, 201, 0.05);
            --card-bg: #2B2825;
            --card-text: #E5DFC9;
            --panel-bg: rgba(26, 25, 24, 0.9);
            --accent-pink: #D86B93;
            --accent-teal: #00B4C5;
            --text-main: #D8D2C2;
            --text-sub: #8C867A;
            --border-color: #4A453D;
            --shadow-color: rgba(0, 0, 0, 0.5);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Share Tech Mono', 'Zen Kaku Gothic New', monospace;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            background-image: 
                linear-gradient(var(--grid-line) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
            background-size: 20px 20px;
            transition: background-color 0.4s ease, color 0.4s ease;
            padding: 12px 16px;
        }

        /* ヘッダー：確実に画面最上部に収まるよう調整 */
        header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
            flex-shrink: 0;
        }

        .system-title-box {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .system-title {
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 1.5px;
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--text-sub);
        }

        .system-title::before {
            content: "";
            display: inline-block;
            width: 6px;
            height: 6px;
            background-color: var(--accent-pink);
        }

        .date-display {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--text-main);
            letter-spacing: 1.5px;
            margin-left: 10px;
            font-family: 'Share Tech Mono', monospace;
        }

        /* メインエリア：中央に安全に収まる配置 */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 100%;
            gap: 16px;
            z-index: 10;
            min-height: 0;
        }

        .clock-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .group-container {
            display: flex;
            gap: 6px;
        }

        /* 8インチ向け時計カードサイズ */
        .flip-unit {
            position: relative;
            width: 105px;
            height: 150px;
            perspective: 500px;
            box-shadow: 0 8px 20px var(--shadow-color);
            border-radius: 6px;
            background-color: var(--card-bg);
        }

        .seconds-group .flip-unit {
            width: 70px;
            height: 100px;
        }

        /* 数字フォントサイズ */
        .card-half {
            position: absolute;
            left: 0;
            width: 100%;
            height: 50%;
            overflow: hidden;
            color: var(--card-text);
            background-color: var(--card-bg);
            font-family: 'Share Tech Mono', monospace;
            font-size: 115px;
            font-weight: bold;
            display: flex;
            justify-content: center;
        }

        .seconds-group .card-half {
            font-size: 75px;
        }

        .card-top {
            top: 0;
            border-top-left-radius: 6px;
            border-top-right-radius: 6px;
            align-items: flex-end;
            border-bottom: 1px solid rgba(0, 0, 0, 0.4);
        }
        .card-top span { transform: translateY(50%); }

        .card-bottom {
            bottom: 0;
            border-bottom-left-radius: 6px;
            border-bottom-right-radius: 6px;
            align-items: flex-start;
        }
        .card-bottom span { transform: translateY(-50%); }

        .card-flipping {
            top: 0;
            border-top-left-radius: 6px;
            border-top-right-radius: 6px;
            align-items: flex-end;
            transform-origin: bottom;
            transform-style: preserve-3d;
            z-index: 20;
            backface-visibility: hidden;
        }
        .card-flipping span { transform: translateY(50%); }

        .fold-animation {
            animation: flipFold 0.35s ease-in forwards;
        }

        @keyframes flipFold {
            0% { transform: rotateX(0deg); background-color: var(--card-bg); }
            100% { transform: rotateX(-180deg); background-color: #1a1816; }
        }

        .flip-unit::before {
            content: "";
            position: absolute;
            top: 50%;
            left: 0;
            width: 100%;
            height: 2px;
            background-color: rgba(0, 0, 0, 0.75);
            z-index: 30;
            margin-top: -1px;
            pointer-events: none;
        }

        .flip-unit::after {
            content: "";
            position: absolute;
            top: 50%;
            left: -3px;
            right: -3px;
            height: 10px;
            border-left: 5px solid var(--border-color);
            border-right: 5px solid var(--border-color);
            margin-top: -5px;
            z-index: 31;
            pointer-events: none;
        }

        /* コロン */
        .colon-container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 12px;
        }

        .colon-dot {
            width: 9px;
            height: 9px;
            background-color: var(--text-main);
            opacity: 0.8;
        }

        /* ポモドーロタイマーパネル */
        .pomodoro-panel {
            width: 100%;
            max-width: 620px;
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            padding: 10px 18px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            box-shadow: 0 4px 15px var(--shadow-color);
            backdrop-filter: blur(4px);
        }

        .pomodoro-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.8rem;
            letter-spacing: 1px;
        }

        .pomodoro-time {
            font-family: 'Share Tech Mono', monospace;
            font-size: 1.1rem;
            font-weight: bold;
            color: var(--accent-pink);
        }

        .pomo-meter-track {
            width: 100%;
            height: 10px;
            background-color: rgba(0, 0, 0, 0.15);
            border: 1px solid var(--border-color);
            position: relative;
            overflow: hidden;
        }

        .pomo-meter-fill {
            position: absolute;
            top: 0;
            right: 0;
            width: 100%;
            height: 100%;
            background-color: var(--accent-pink);
            transition: width 0.3s linear;
        }

        .pomodoro-controls {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
        }

        /* フッター */
        footer {
            width: 100%;
            z-index: 10;
            flex-shrink: 0;
        }

        .nier-footer-box {
            position: relative;
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            padding: 6px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nier-footer-box::before {
            content: "";
            position: absolute;
            left: 4px;
            top: 4px;
            bottom: 4px;
            width: 5px;
            border-left: 2px solid var(--text-main);
            border-right: 1px solid var(--text-main);
        }

        .nier-footer-box::after {
            content: "";
            position: absolute;
            right: 6px;
            bottom: 6px;
            width: 6px;
            height: 6px;
            background-color: var(--text-main);
        }

        .footer-message {
            font-size: 0.75rem;
            letter-spacing: 0.5px;
            padding-left: 8px;
        }

        .footer-controls {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .nier-btn {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 4px 10px;
            font-family: inherit;
            font-size: 0.75rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .nier-btn:hover, .nier-btn:active {
            background-color: var(--text-main);
            color: var(--bg-color);
        }

        .dots-pattern-line {
            width: 100%;
            height: 4px;
            margin-top: 4px;
            background-image: radial-gradient(var(--text-main) 1.2px, transparent 1.2px);
            background-size: 8px 6px;
            opacity: 0.6;
        }
    </style>
</head>
<body>

    <header id="header-ui">
        <div class="system-title-box">
            <div class="system-title">// SYSTEM : KAKEIBO_CLOCK [v4.4_FIX]</div>
            <div class="date-display" id="date-text">----/--/-- (---)</div>
        </div>
        <div id="battery-box" style="font-size: 0.85rem; color: var(--text-sub); font-family: 'Share Tech Mono', monospace;">
            BATTERY: <span id="battery-text">--%</span>
        </div>
    </header>

    <main>
        <!-- パタパタ時計 -->
        <div class="clock-container">
            <div class="group-container">
                <div class="flip-unit" id="h1"><div class="card-half card-top"><span>0</span></div><div class="card-half card-bottom"><span>0</span></div></div>
                <div class="flip-unit" id="h2"><div class="card-half card-top"><span>0</span></div><div class="card-half card-bottom"><span>0</span></div></div>
            </div>

            <div class="colon-container">
                <div class="colon-dot"></div>
                <div class="colon-dot"></div>
            </div>

            <div class="group-container">
                <div class="flip-unit" id="m1"><div class="card-half card-top"><span>0</span></div><div class="card-half card-bottom"><span>0</span></div></div>
                <div class="flip-unit" id="m2"><div class="card-half card-top"><span>0</span></div><div class="card-half card-bottom"><span>0</span></div></div>
            </div>

            <div class="colon-container sec-colon" id="sec-colon">
                <div class="colon-dot"></div>
                <div class="colon-dot"></div>
            </div>

            <div class="group-container seconds-group" id="sec-group">
                <div class="flip-unit" id="s1"><div class="card-half card-top"><span>0</span></div><div class="card-half card-bottom"><span>0</span></div></div>
                <div class="flip-unit" id="s2"><div class="card-half card-top"><span>0</span></div><div class="card-half card-bottom"><span>0</span></div></div>
            </div>
        </div>

        <!-- ポモドーロタイマーパネル -->
        <div class="pomodoro-panel">
            <div class="pomodoro-header">
                <span>// POMODORO TIMER (30 MIN)</span>
                <span class="pomodoro-time" id="pomo-display">30:00</span>
            </div>
            <div class="pomo-meter-track">
                <div class="pomo-meter-fill" id="pomo-fill" style="width: 100%;"></div>
            </div>
            <div class="pomodoro-controls">
                <button class="nier-btn" id="pomo-start-btn">▶ START</button>
                <button class="nier-btn" id="pomo-stop-btn">■ STOP</button>
                <button class="nier-btn" id="pomo-reset-btn">↺ RESET</button>
            </div>
        </div>
    </main>

    <footer id="footer-ui">
        <div class="nier-footer-box">
            <div class="footer-message" id="pomo-status-msg">
                <span>// システム状態: 正常稼働中。集中タスク実行待機中。</span>
            </div>
            <div class="footer-controls">
                <button class="nier-btn" id="theme-btn">◐ テーマ切替</button>
                <button class="nier-btn" id="sec-toggle-btn">⏱ 秒表示 ON/OFF</button>
                <button class="nier-btn" id="fullscreen-btn">⛶ 全画面</button>
            </div>
        </div>
        <div class="dots-pattern-line"></div>
    </footer>

    <script>
        const digitsPrev = { h1: '', h2: '', m1: '', m2: '', s1: '', s2: '' };
        let showSeconds = true;

        function updateDigit(id, newValue) {
            if (digitsPrev[id] === newValue) return;
            const oldValue = digitsPrev[id];
            digitsPrev[id] = newValue;

            const unit = document.getElementById(id);
            if (!unit) return;

            const topElem = unit.querySelector('.card-top span');
            const bottomElem = unit.querySelector('.card-bottom span');

            if (oldValue === '') {
                topElem.textContent = newValue;
                bottomElem.textContent = newValue;
                return;
            }

            const oldFlipping = unit.querySelector('.card-flipping');
            if (oldFlipping) oldFlipping.remove();

            const flipping = document.createElement('div');
            flipping.className = 'card-half card-flipping';
            flipping.innerHTML = `<span>${oldValue}</span>`;
            unit.appendChild(flipping);

            topElem.textContent = newValue;

            requestAnimationFrame(() => {
                flipping.classList.add('fold-animation');
            });

            flipping.addEventListener('animationend', () => {
                bottomElem.textContent = newValue;
                flipping.remove();
            });
        }

        function updateClock() {
            const now = new Date();
            const h = String(now.getHours()).padStart(2, '0');
            const m = String(now.getMinutes()).padStart(2, '0');
            const s = String(now.getSeconds()).padStart(2, '0');

            updateDigit('h1', h[0]);
            updateDigit('h2', h[1]);
            updateDigit('m1', m[0]);
            updateDigit('m2', m[1]);

            if (showSeconds) {
                updateDigit('s1', s[0]);
                updateDigit('s2', s[1]);
            }

            const days = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];
            const dateStr = `${now.getFullYear()}/${String(now.getMonth() + 1).padStart(2, '0')}/${String(now.getDate()).padStart(2, '0')} (${days[now.getDay()]})`;
            const dateEl = document.getElementById('date-text');
            if (dateEl) dateEl.textContent = dateStr;
        }

        setInterval(updateClock, 100);
        updateClock();

        // --- Web Audio API によるシステム音生成 ---
        let audioCtx = null;
        function getAudioContext() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            return audioCtx;
        }

        function play25MinSound() {
            try {
                const ctx = getAudioContext();
                const now = ctx.currentTime;
                
                [0, 0.15].forEach((timeOffset, index) => {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(880 + (index * 220), now + timeOffset);
                    
                    gain.gain.setValueAtTime(0.15, now + timeOffset);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + timeOffset + 0.1);
                    
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    
                    osc.start(now + timeOffset);
                    osc.stop(now + timeOffset + 0.1);
                });
            } catch (e) {}
        }

        function play30MinSound() {
            try {
                const ctx = getAudioContext();
                const now = ctx.currentTime;

                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sawtooth';
                
                osc.frequency.setValueAtTime(440, now);
                osc.frequency.exponentialRampToValueAtTime(110, now + 0.6);

                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.6);

                osc.connect(gain);
                gain.connect(ctx.destination);

                osc.start(now);
                osc.stop(now + 0.6);
            } catch (e) {}
        }

        // --- ポモドーロタイマー ロジック ---
        const TOTAL_TIME = 30 * 60;
        let timeLeft = TOTAL_TIME;
        let pomoTimer = null;
        let isRunning = false;

        const pomoDisplay = document.getElementById('pomo-display');
        const pomoFill = document.getElementById('pomo-fill');
        const pomoStatusMsg = document.getElementById('pomo-status-msg');

        function formatTime(seconds) {
            const m = Math.floor(seconds / 60);
            const s = seconds % 60;
            return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
        }

        function updatePomodoroUI() {
            pomoDisplay.textContent = formatTime(timeLeft);
            const percentage = (timeLeft / TOTAL_TIME) * 100;
            pomoFill.style.width = `${percentage}%`;
        }

        document.getElementById('pomo-start-btn').addEventListener('click', () => {
            getAudioContext();
            if (isRunning) return;
            isRunning = true;
            pomoStatusMsg.innerHTML = `<span>// システム状態: 集中セッション実行中（残り ${Math.ceil(timeLeft/60)}分）</span>`;

            pomoTimer = setInterval(() => {
                if (timeLeft > 0) {
                    timeLeft--;
                    updatePomodoroUI();

                    if (timeLeft === 5 * 60) {
                        play25MinSound();
                        pomoStatusMsg.innerHTML = `<span>// 警告: 25分経過。残り5分です。</span>`;
                    }
                } else {
                    clearInterval(pomoTimer);
                    isRunning = false;
                        play30MinSound();
                    pomoStatusMsg.innerHTML = `<span>// 完了: 30分セッションが終了しました。</span>`;
                }
            }, 1000);
        });

        document.getElementById('pomo-stop-btn').addEventListener('click', () => {
            if (!isRunning) return;
            clearInterval(pomoTimer);
            isRunning = false;
            pomoStatusMsg.innerHTML = `<span>// システム状態: 一時停止中。</span>`;
        });

        document.getElementById('pomo-reset-btn').addEventListener('click', () => {
            clearInterval(pomoTimer);
            isRunning = false;
            timeLeft = TOTAL_TIME;
            updatePomodoroUI();
            pomoStatusMsg.innerHTML = `<span>// システム状態: タイマーリセット。実行待機中。</span>`;
        });

        // 共通コントロール
        document.getElementById('sec-toggle-btn').addEventListener('click', () => {
            showSeconds = !showSeconds;
            document.getElementById('sec-group').style.display = showSeconds ? 'flex' : 'none';
            document.getElementById('sec-colon').style.display = showSeconds ? 'flex' : 'none';
        });

        document.getElementById('theme-btn').addEventListener('click', () => {
            document.body.classList.toggle('dark-mode');
        });

        document.getElementById('fullscreen-btn').addEventListener('click', () => {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(() => {});
            } else {
                document.exitFullscreen().catch(() => {});
            }
        });

        if ('getBattery' in navigator) {
            navigator.getBattery().then(battery => {
                function updateBattery() {
                    const level = Math.round(battery.level * 100);
                    const charging = battery.charging ? '⚡' : '';
                    const bEl = document.getElementById('battery-text');
                    if (bEl) bEl.textContent = `${level}% ${charging}`;
                }
                updateBattery();
                battery.addEventListener('levelchange', updateBattery);
                battery.addEventListener('chargingchange', updateBattery);
            });
        }
    </script>
</body>
</html>
